# 회의록 담당자 확정 규칙 설정. src/onboarding_agent/meeting/owner_rules.py가 읽는다.
# 기준은 docs/DECISIONS.md "담당자 확정 기준"을 따른다. 고친 뒤에는 앱을 다시 시작한다.

# 기관을 대표해 발언하는 기관장급 직함(중앙행정기관장·공공기관장·지방자치단체장).
# 회의록에서 이름 바로 앞이나 뒤의 직함이 이 값으로 끝나면(예: '가상부장관', '제1차관', '가상광역시장')
# 그 사람의 약속은 기관의 약속으로 보고 담당자를 확정하지 않는다.
# 같은 약속 문장에 '직접'이 있을 때만(예: "제가 직접 챙기겠습니다") 개인으로 확정한다. '제가'만으로는 확정하지 않는다.
# '직접'이 부정되거나('직접 챙기기는 어렵겠습니다만') 다른 사람의 것이거나('차관이 직접') 명사의 일부면('직접고용') 세지 않는다.
# 팀 회의 직함(주무관·사무관·과장·팀장 등)은 넣지 않는다.
# '시장'·'군수'는 일반 낱말과 겹치지만 이름 바로 앞뒤의 직함만 보므로 지방자치단체장 범주로 넣었다.
institution_head_titles:
  - 총리
  - 장관
  - 차관
  - 청장
  - 처장
  - 원장
  - 총장
  - 재판소장
  - 연구소장
  - 사장
  - 이사장
  # 지방자치단체장
  - 특별시장
  - 광역시장
  - 특별자치시장
  - 도지사
  - 특별자치도지사
  - 시장
  - 군수
  - 구청장
  - 교육감
  # 지방자치단체장의 부단체장(차관처럼 기관을 대표): 부시장·부군수·부구청장·부교육감은 위 직함으로 끝나 함께 잡히고,
  # 부지사는 '도지사'로 끝나지 않아 따로 적는다.
  - 부지사
  - 국무조정실장
  - 공정거래위원장
  - 금융위원장
  - 방송통신위원장
  - 원자력안전위원장
  - 국민권익위원장
  - 국가인권위원장
  - 개인정보보호위원장

# 위 직함과 끝이 같지만 기관장이 아닌 직함. 둘 다 맞으면 더 긴 직함을 따른다.
# 예: 국회 위원회의 '위원장'은 '원장'으로 끝나지만 회의 진행자라 개인 자격 발언자로 본다.
not_institution_head_titles:
  - 위원장
  - 소위원장
  - 부위원장

# 후보자·내정자는 지명된 직함으로 본다(예: '가상재판소장후보자' → '가상재판소장').
nominee_suffixes:
  - 후보자
  - 내정자

# 약한 약속 표현. 약속 서술어(~하겠습니다, ~할게요, ~하기로)의 서술 부분이면
# 구체적인 약속이 아니라고 보고 담당자를 확정하지 않는다. 띄어쓰기는 무시한다.
# "-하도록 하겠", "-토록 하겠"은 "-하겠"과 같게 본다(예: "참고하도록 하겠습니다" = "참고하겠습니다").
# 표현과 약속 서술어 사이에는 조사·부사·보조용언만 올 수 있다: "최선을 다하겠습니다", "참고만 하겠습니다"는 약하고,
# "최선의 방안을 마련하겠습니다", "자료를 참고하여 작성하겠습니다"는 약하지 않다.
weak_promise_phrases:
  - 노력
  - 최선
  - 유념
  - 참고
  - 고민
  - 생각해 보
  - 검토해 보

# 약한 약속의 예외. 아래 표현은 화자 본인의 같은 문장에 1인칭 단수('제가'·'저는')와
# 구체적인 기한(날짜·요일·'~까지')이 함께 있으면 약한 약속으로 보지 않는다.
# 예: "제가 금요일까지 검토해 보겠습니다"는 확정 후보, "검토해 보겠습니다"는 미확정.
# 이 예외는 기관장급이 아닌 화자에게만 적용한다(기관장급은 위 '직접' 규칙을 따른다).
weak_promise_exceptions:
  - 검토해 보
  - 생각해 보
  - 고민해 보
