# 규정 Q&A 개발 세트 (에이전트 작성). 검색 방식과 RAG_MIN_SCORE를 정하는 데 쓴다(검색만, 생성 없음). 생성 점검(C3 d07, C4 d23·d24, D4 회색 구간 d07·d11·d17·d19와 d25·d28)에도 썼다.
# 색인에 넣지 않는다. 기대 근거는 색인된 원문(국가공무원 복무규정·복무규칙, 공무원 행동강령)을 보고 적었다.
# scope: in(규정으로 답할 수 있음, 기본) | out(기관 내부 사정 등 규정 밖) | boundary(일부만 규정에 있음).
# 2026-10-10 C3: 범위 밖 8문항(d11~d18)과 경계 4문항(d19~d22)을 더했다. 최종 세트는 보지 않고 썼다.
# 2026-10-10 D3: 범위 안 일상어 10문항(d25~d34, style: everyday)을 더했다. 신입이 실제로 물을 말투로, 조문 용어·휴가 이름 없이 상황으로 묻는다.
#   최종 세트 문항을 바꿔 말한 질문은 넣지 않았다(검토에서 f02와 겹친다고 본 임신 검진 질문은 휴가 중 주말 질문으로 바꿨다).
# out_kind: internal(기관 내부 사정) | other(여비·인젝션). 하한 계산은 internal만 쓴다(D3).
