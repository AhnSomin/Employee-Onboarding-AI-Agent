# 작은 용어집: 일상어 → 규정 용어. BM25 검색어를 늘리는 데만 쓴다.
# 벡터 검색은 원래 질문 그대로 하고, 답변에서 두 말이 같은 뜻이라고 단정하지 않는다.
연차: [연가]
월차: [연가]
반차: [반일, 연가]
병결: [병가]
야근: [시간외근무]
초과근무: [시간외근무]
특근: [시간외근무, 휴일]
경조사: [특별휴가, 경조사]
결혼: [결혼, 특별휴가]
사원증: [공무원증]
신분증: [공무원증]
선물: [금품]
뇌물: [금품]
부업: [겸직, 영리]
투잡: [겸직, 영리]
알바: [겸직, 영리]
출퇴근: [근무시간]
지각: [근무상황, 지각]
조퇴: [근무상황, 조퇴]
