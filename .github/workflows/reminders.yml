# 액션 아이템 리마인더 배치 (docs/AGENT_SPEC_MEETING.md 10.4)
# - schedule은 UTC 기준이다. 평일 09:00 KST = 00:00 UTC. 실행이 몇 분~수십 분 늦을 수 있다.
# - 예약 실행은 저장소 기본 브랜치(main)에 있는 이 파일로만 돈다.
# - 상태는 Google Sheets에서 읽고 쓴다. 러너의 파일은 실행이 끝나면 사라진다.
# - 수동 실행: Actions → reminders → Run workflow (now·dry_run 입력).
# - Secrets가 비어 있으면 "설정 필요"를 남기고 성공으로 끝난다(병합 직후 등록 전 실패가 쌓이지 않게).
name: reminders

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      now:
        description: "기준 시각 (ISO 8601, 예: 2026-10-15T09:00:00+09:00). 비우면 지금"
        required: false
        type: string
      dry_run:
        description: "Slack으로 보내지 않고 메시지만 출력"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATE_BACKEND: sheets
      TIMEZONE: Asia/Seoul
      ACTIONS_DRY_RUN: "false"
      PYTHONPATH: src
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
    steps:
      - name: Check secrets
        id: config
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          required=(GOOGLE_SERVICE_ACCOUNT_JSON GSHEETS_SPREADSHEET_ID)
          if [ "$DRY_RUN" != "true" ]; then required+=(SLACK_BOT_TOKEN SLACK_CHANNEL_ID); fi
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "설정 필요: 저장소 Secrets가 비어 있어 리마인더를 건너뜁니다 — ${missing[*]}"
            echo "::warning title=설정 필요::저장소 Secrets 등록 필요: ${missing[*]}"
            echo "설정 필요: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-python@v7
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-batch.txt
      - name: Install batch dependencies
        if: steps.config.outputs.ready == 'true'
        run: pip install -r requirements-batch.txt
      - name: Send reminders
        if: steps.config.outputs.ready == 'true'
        env:
          NOW: ${{ inputs.now }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$NOW" ]; then args+=(--now "$NOW"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/run_reminders.py "${args[@]}"
