<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ORIENT · Workflow</title>
<style>
  :root {
    --bg1: #fffbf7; --bg2: #fff1e3; --ink: #2a2019; --muted: #7a6b60; --faint: #b3a69a;
    --or: #ff6f0f; --or-soft: #fff0e5; --or-line: #ffd7b8; --gr: #9a8b7e; --gr-soft: #f7f2ed; --gr-line: #d8cdc2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(135deg, var(--bg1), var(--bg2)); color: var(--ink);
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }

  #stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: 0 0; }

  /* 헤더 */
  .eyebrow { position: absolute; left: 56px; top: 40px; font-size: 15px; font-weight: 800; letter-spacing: .3em; color: var(--or); }
  h1 { position: absolute; left: 56px; top: 66px; margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -.5px; }
  .sub { position: absolute; left: 56px; top: 126px; font-size: 19px; color: var(--muted); }
  .controls { position: absolute; right: 56px; top: 44px; display: flex; gap: 10px; align-items: center; }
  .tab { height: 46px; padding: 0 22px; border-radius: 23px; font-size: 18px; font-weight: 700; color: var(--muted); background: #fff; border: 1.5px solid #f0e2d6; transition: .2s; }
  .tab:hover { border-color: var(--or-line); color: var(--ink); }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .play { height: 46px; padding: 0 20px; border-radius: 23px; font-size: 17px; font-weight: 800; color: #fff; background: var(--or); box-shadow: 0 6px 16px rgba(255,111,15,.28); }
  .play:hover { filter: brightness(1.05); }
  .legend { position: absolute; right: 56px; top: 108px; display: flex; gap: 18px; font-size: 15px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; }

  /* 레인 */
  .lane { position: absolute; left: 56px; width: 1240px; height: 270px; border-radius: 28px; }
  .lane.before { top: 176px; background: var(--gr-soft); }
  .lane.after { top: 466px; background: #fff; border: 1.5px solid var(--or-line); box-shadow: 0 14px 36px rgba(255,111,15,.12); }
  .lane.after::before { content: ""; position: absolute; left: 0; top: 40px; bottom: 40px; width: 6px; border-radius: 3px; background: var(--or); }
  .lane-label { position: absolute; left: 42px; top: 92px; }
  .lane-label b { display: block; font-size: 26px; font-weight: 800; color: var(--muted); }
  .lane.after .lane-label b { color: var(--ink); }
  .lane-label span { font-size: 15px; font-weight: 700; color: var(--faint); }
  .lane.after .lane-label span { color: var(--or); }
  .meter { position: absolute; left: 42px; bottom: 26px; font-size: 14.5px; color: var(--muted); }
  .meter b { font-size: 20px; color: var(--ink); margin: 0 2px; font-variant-numeric: tabular-nums; }

  .track { position: absolute; left: 208px; top: 0; width: 1010px; height: 100%; }
  .line { position: absolute; left: 0; right: 0; top: 74px; height: 5px; border-radius: 3px; background: var(--gr-line); }
  .lane.after .line { background: #ffe3cc; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--gr); transition: width .7s cubic-bezier(.4,0,.2,1); }
  .lane.after .fill { background: var(--or); transition-duration: .42s; }
  .dot { position: absolute; top: 66px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: var(--gr); box-shadow: 0 0 0 7px rgba(154,139,126,.18); transition: left .7s cubic-bezier(.4,0,.2,1), opacity .3s; opacity: 0; }
  .lane.after .dot { background: var(--or); box-shadow: 0 0 0 8px rgba(255,111,15,.2); transition-duration: .42s; }
  .dot.show { opacity: 1; }

  .steps { position: absolute; inset: 0; display: grid; }
  .step { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 38px; text-align: center; }
  .node { width: 64px; height: 64px; border-radius: 50%; background: #fff; border: 3px solid var(--gr-line); display: grid; place-items: center;
    font-size: 24px; font-weight: 800; color: var(--faint); transition: all .35s; position: relative; z-index: 2; }
  .step .lbl { margin-top: 20px; font-size: 21px; line-height: 1.4; color: var(--faint); font-weight: 600; transition: color .35s; min-height: 60px; }
  .step .lbl em { display: block; font-style: normal; font-weight: 500; font-size: 19px; }
  .chip { margin-top: 8px; height: 26px; padding: 0 12px; border-radius: 13px; font-size: 13px; font-weight: 800; color: #fff; display: inline-grid; place-items: center; opacity: 0; transform: translateY(-4px); transition: all .35s; }
  .chip.human { background: var(--gr); } .chip.ai { background: var(--or); }
  .bubble { position: absolute; top: 4px; left: 50%; transform: translate(-50%, 6px); white-space: nowrap; font-size: 14px; font-weight: 800; padding: 5px 12px; border-radius: 14px;
    background: #fff; color: #b4570a; border: 1.5px solid #ffcf9f; opacity: 0; transition: all .35s; z-index: 3; }
  .step.reached .bubble { opacity: 1; transform: translate(-50%, 0); }
  .step.reached .chip { opacity: 1; transform: none; }
  .step.reached .lbl { color: var(--ink); }
  .step.reached .node { border-color: var(--gr); color: #fff; background: var(--gr); transform: scale(1.06); }
  .lane.after .step.reached .node.ai { border-color: var(--or); background: var(--or); box-shadow: 0 8px 20px rgba(255,111,15,.35); }
  .lane.after .step.reached .node.human { border-color: var(--gr); background: var(--gr); }
  .step.now .node { animation: pop .5s ease; }
  .step.now.ai-step .node::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--or); animation: ring 1s ease-out infinite; }
  .step { cursor: pointer; } .step:hover .node { transform: scale(1.1); }
  .step.sel .node { outline: 3px solid rgba(255,111,15,.35); outline-offset: 4px; }
  @keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.2); } 100% { transform: scale(1.06); } }
  @keyframes ring { 0% { transform: scale(.85); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }

  /* 통계 카드 */
  .stat { position: absolute; left: 1320px; top: 176px; width: 224px; height: 560px; border-radius: 28px; background: #fff; border: 1.5px solid #f2e4d6; box-shadow: 0 8px 22px rgba(90,58,30,.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .stat .cap { font-size: 17px; font-weight: 700; color: var(--muted); }
  .nums { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 96px; line-height: 1; font-variant-numeric: tabular-nums; }
  .nums .b { color: #cfc3b8; min-width: 54px; text-align: center; transition: color .3s; } .nums .a { color: var(--or); min-width: 54px; text-align: center; }
  .nums svg { width: 38px; height: 38px; }
  .delta { height: 34px; padding: 0 16px; border-radius: 17px; background: var(--or); color: #fff; font-weight: 800; font-size: 17px; display: grid; place-items: center; opacity: 0; transform: scale(.8); transition: all .4s; }
  .delta.show { opacity: 1; transform: none; }
  .stat .note { font-size: 15px; color: var(--muted); text-align: center; line-height: 1.5; padding: 0 14px; }

  /* 하단 설명 */
  .detail { position: absolute; left: 56px; right: 56px; top: 764px; height: 98px; border-radius: 26px; background: var(--ink); color: #fff; padding: 0 36px; display: flex; flex-direction: column; justify-content: center; transition: background .3s; }
  .detail.sel { background: #3a2c22; }
  .detail .t { font-size: 20px; font-weight: 800; margin-bottom: 6px; } .detail .t b { color: var(--or); }
  .detail .d { font-size: 17.5px; line-height: 1.5; color: #e9ddd2; }
  .detail.idle { align-items: center; text-align: center; }
  .detail.idle .t { margin: 0; font-size: 22px; }
  .hint { position: absolute; left: 56px; top: 870px; font-size: 13px; color: var(--faint); }
</style>
</head>
<body>
<div id="stage">
  <div class="eyebrow">ORIENT · WORKFLOW</div>
  <h1>AI 적용 전 vs 후</h1>
  <div class="sub">같은 업무에서 사람이 하는 단계는 줄고, 사람은 검토·승인과 예외에만 개입합니다</div>
  <div class="controls">
    <button class="tab" data-i="0">① 규정 질문</button>
    <button class="tab" data-i="1">② 회의 후속 업무</button>
    <button class="play" id="play">▶ 다시 재생</button>
  </div>
  <div class="legend"><span><i style="background:var(--gr)"></i>사람</span><span><i style="background:var(--or)"></i>AI · 자동</span></div>

  <section class="lane before" id="laneB"></section>
  <section class="lane after" id="laneA"></section>

  <aside class="stat">
    <div class="cap">사람이 하는 단계</div>
    <div class="nums"><span class="b" id="nb">0</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="#ff6f0f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      <span class="a" id="na">0</span></div>
    <div class="delta" id="delta"></div>
    <div class="note" id="statNote"></div>
  </aside>

  <div class="detail idle" id="detail"></div>
  <div class="hint">단계를 클릭하면 설명이 나와요 · 1 / 2 : 업무 선택 · Space : 다시 재생</div>
</div>

<script>
const DATA = [
  { name: "규정 질문", note: "답변 대기 → 즉시 답변",
    before: [
      { t: ["인사담당자에게", "메신저·전화로 문의"], who: "사람", ti: "신입이 인사담당자에게 문의", d: "신입이 메신저나 전화로 인사담당자에게 질문합니다. 질문이 올 때마다 담당자 응대가 필요합니다." },
      { t: ["담당자가 규정을", "찾아 해석"], who: "사람", ti: "담당자가 규정을 찾아 해석", d: "담당자가 규정집과 법령을 직접 찾아 읽고, 신입이 이해할 수 있게 풀어서 정리합니다." },
      { t: ["답변 전달", "신입은 그동안 대기"], who: "사람", bubble: "⏳ 대기", ti: "답변 전달 — 신입은 대기", d: "답을 받을 때까지 신입은 기다립니다. 담당자가 바쁘면 그만큼 늦어집니다." },
    ],
    after: [
      { t: ["채팅으로 질문"], who: "사람", ti: "채팅으로 질문", d: "채팅창에 궁금한 점을 그대로 입력합니다. 접근 코드만 있으면 바로 쓸 수 있습니다." },
      { t: ["AI가 조문 검색", "· 재순위"], who: "AI", ti: "AI가 조문 검색·재순위", d: "질문을 법령 용어로 확장하고, 키워드(BM25)와 임베딩을 합친 하이브리드 검색 뒤 LLM이 순위를 다시 매깁니다. (검색 hit@3 84% · 질문 68개 기준)" },
      { t: ["근거 조문 + 쉬운 말로", "즉시 답변"], who: "AI", bubble: "⚡ 즉시", ti: "근거 조문과 함께 즉시 답변", d: "조문 번호를 근거로 달아 쉬운 말로 답합니다. 검색 결과에 없는 숫자는 쓰지 않도록 제한합니다." },
      { t: ["근거 없으면", "담당자 연결 (예외)"], who: "AI", ti: "예외: 근거가 없으면 담당자 연결", d: "근거를 찾지 못하면 추측하지 않고 인사담당자 확인을 요청합니다. 규정과 무관한 질문은 범위 밖이라고 안내합니다." },
    ] },
  { name: "회의 후속 업무", note: "정리·등록·독촉 → 업로드 + 승인",
    before: [
      { t: ["회의록 읽고", "할 일 추리기"], who: "사람", ti: "회의록 읽고 할 일 추리기", d: "회의가 끝나면 회의록을 처음부터 읽으며 누가 무엇을 언제까지 하는지 직접 뽑아냅니다." },
      { t: ["담당자·기한", "표로 정리"], who: "사람", ti: "담당자·기한을 표로 정리", d: "뽑은 할 일을 표로 옮기고, 담당자와 기한이 모호한 곳은 따로 확인해야 합니다." },
      { t: ["캘린더에", "하나씩 등록"], who: "사람", ti: "캘린더에 하나씩 등록", d: "일정을 건마다 캘린더에 직접 입력합니다." },
      { t: ["Slack 공유"], who: "사람", ti: "Slack에 공유", d: "정리한 내용을 글로 써서 채널에 올립니다." },
      { t: ["기한 확인·", "독촉"], who: "사람", bubble: "⚠ 누락 발생", ti: "기한을 확인하고 독촉", d: "마감이 다가오면 담당자마다 일일이 챙깁니다. 바쁘면 빠뜨리기 쉽습니다." },
    ],
    after: [
      { t: ["회의록 업로드"], who: "사람", ti: "회의록 업로드", d: "회의록 텍스트(.txt)를 올립니다. 정리형, 녹취형, 메모형 모두 가능합니다." },
      { t: ["AI가 요약·할 일", "담당자·기한 추출"], who: "AI", ti: "AI가 요약·할 일·담당자·기한 추출", d: "모델은 개요 기록·할 일 제안·추출 종료, 세 도구로만 답합니다. 코드 규칙이 인용, 담당자, 날짜, 프롬프트 주입 여부를 검증합니다." },
      { t: ["미확정 채우고", "승인"], who: "사람", ti: "미확정 항목을 채우고 승인", d: "담당자나 기한이 불분명한 항목은 추측하지 않고 '미확정'으로 표시합니다. 사람이 채우고 확정된 항목만 승인합니다." },
      { t: ["Slack 일정 공유", "+ 캘린더 파일"], who: "AI", ti: "Slack 일정 공유 + 캘린더 파일", d: "일정이 마감일별로 정리되어 Slack에 공유되고, .ics 파일로 캘린더에 추가할 수 있습니다. 같은 승인을 다시 눌러도 중복되지 않습니다." },
      { t: ["마감 전날·당일·", "기한 지남 재알림"], who: "AI", ti: "마감 전날·당일·기한 지남 재알림", d: "담당자를 부르는 새 메시지로 알립니다. 같은 단계는 한 번만 보내고, 단계가 올라가면 다시 보냅니다." },
    ] },
];
const IDLE = "반복 작업은 <b>AI</b>가, 판단(검토·승인)은 <b>사람</b>이 — 모르면 추측하지 않고 사람에게 넘깁니다";
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TRACK_W = 1010;
let cur = 0, token = 0;

function fit() {
  const s = Math.min(innerWidth / 1600, innerHeight / 900);
  const st = $("stage"); st.style.transform = `scale(${s}) translate(-50%, -50%)`;
  st.style.transformOrigin = "0 0"; st.style.left = "50%"; st.style.top = "50%";
}
addEventListener("resize", fit); fit();

function buildLane(el, steps, isAfter) {
  const n = steps.length;
  el.innerHTML = `<div class="lane-label"><b>${isAfter ? "적용 후" : "적용 전"}</b><span>${isAfter ? "ORIENT" : "사람이 직접"}</span></div>
    <div class="meter">사람 개입 <b>0</b>단계</div>
    <div class="track">
      <div class="line"><i class="fill"></i></div><i class="dot"></i>
      <div class="steps" style="grid-template-columns:repeat(${n},1fr)">
        ${steps.map((s, i) => `<div class="step ${s.who === "AI" ? "ai-step" : ""}" data-i="${i}">
          ${s.bubble ? `<span class="bubble">${s.bubble}</span>` : ""}
          <div class="node ${s.who === "AI" ? "ai" : "human"}">${i + 1}</div>
          <div class="lbl">${s.t.map((x, j) => (j ? `<em>${x}</em>` : x)).join("")}</div>
          <span class="chip ${s.who === "AI" ? "ai" : "human"}">${s.who === "AI" ? "AI · 자동" : "사람"}</span>
        </div>`).join("")}
      </div>
    </div>`;
  el.querySelectorAll(".step").forEach((st) => st.addEventListener("click", () => select(el, steps, +st.dataset.i, st)));
}
const cx = (i, n) => (i + 0.5) * TRACK_W / n;

function select(lane, steps, i, st) {
  document.querySelectorAll(".step.sel").forEach((e) => e.classList.remove("sel"));
  st.classList.add("sel");
  const s = steps[i], d = $("detail");
  d.className = "detail sel";
  d.innerHTML = `<div class="t"><b>${i + 1}.</b> ${s.ti} <span style="font-weight:600;color:#c9baa9;font-size:15px;margin-left:8px">${s.who === "AI" ? "AI · 자동" : "사람"}</span></div><div class="d">${s.d}</div>`;
}
function idle() { const d = $("detail"); d.className = "detail idle"; d.innerHTML = `<div class="t">${IDLE}</div>`;
  document.querySelectorAll(".step.sel").forEach((e) => e.classList.remove("sel")); }

function reset() {
  document.querySelectorAll(".step").forEach((e) => e.classList.remove("reached", "now"));
  document.querySelectorAll(".fill").forEach((e) => (e.style.width = "0"));
  document.querySelectorAll(".dot").forEach((e) => { e.classList.remove("show"); e.style.left = "0px"; });
  document.querySelectorAll(".meter b").forEach((e) => (e.textContent = "0"));
  $("nb").textContent = "0"; $("na").textContent = "0"; $("delta").classList.remove("show"); idle();
}

async function runLane(laneEl, steps, myToken, numEl, gap, isAfter) {
  const dot = laneEl.querySelector(".dot"), fill = laneEl.querySelector(".fill"), stepEls = laneEl.querySelectorAll(".step");
  const meter = laneEl.querySelector(".meter b"); let human = 0; const n = steps.length;
  dot.style.transition = "none"; dot.style.left = cx(0, n) + "px"; dot.offsetWidth; dot.style.transition = ""; dot.classList.add("show");
  for (let i = 0; i < n; i++) {
    if (myToken !== token) return;
    const x = cx(i, n); dot.style.left = x + "px"; fill.style.width = x + "px";
    await sleep(i === 0 ? 200 : gap * 0.6);
    if (myToken !== token) return;
    stepEls.forEach((e) => e.classList.remove("now")); stepEls[i].classList.add("reached", "now");
    if (steps[i].who === "사람") { human++; meter.textContent = human; numEl.textContent = human; }
    await sleep(gap * 0.55);
  }
  stepEls.forEach((e) => e.classList.remove("now"));
}

async function play() {
  const my = ++token; reset();
  const w = DATA[cur];
  if (reduce) { showFinal(); return; }
  await sleep(350);
  await runLane($("laneB"), w.before, my, $("nb"), 1250, false);
  if (my !== token) return; await sleep(450);
  await runLane($("laneA"), w.after, my, $("na"), 760, true);
  if (my !== token) return;
  const d = w.before.filter((s) => s.who === "사람").length - w.after.filter((s) => s.who === "사람").length;
  $("delta").textContent = `사람 단계 −${d}`; $("delta").classList.add("show");
}
function showFinal() {
  const w = DATA[cur];
  [["laneB", w.before, "nb"], ["laneA", w.after, "na"]].forEach(([id, steps, num]) => {
    const l = $(id); l.querySelectorAll(".step").forEach((e) => e.classList.add("reached"));
    l.querySelector(".fill").style.width = TRACK_W + "px";
    const h = steps.filter((s) => s.who === "사람").length; l.querySelector(".meter b").textContent = h; $(num).textContent = h;
  });
  const d = w.before.filter((s) => s.who === "사람").length - w.after.filter((s) => s.who === "사람").length;
  $("delta").textContent = `사람 단계 −${d}`; $("delta").classList.add("show");
}

function setWorkflow(i, auto = true) {
  cur = i; const w = DATA[i];
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", +t.dataset.i === i));
  buildLane($("laneB"), w.before, false); buildLane($("laneA"), w.after, true);
  $("statNote").textContent = w.note;
  if (auto) play(); else { token++; reset(); showFinal(); }
  history.replaceState(null, "", "#" + (i + 1));
}
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => setWorkflow(+t.dataset.i)));
$("play").addEventListener("click", play);
addEventListener("keydown", (e) => {
  if (e.key === "1") setWorkflow(0); else if (e.key === "2") setWorkflow(1);
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); play(); }
  else if (e.key === "ArrowRight") setWorkflow(Math.min(1, cur + 1)); else if (e.key === "ArrowLeft") setWorkflow(Math.max(0, cur - 1));
  else if (e.key === "Escape") idle();
});
document.addEventListener("click", (e) => { if (!e.target.closest(".step") && !e.target.closest(".detail")) idle(); });
const q = new URLSearchParams(location.search);
setWorkflow(location.hash === "#2" ? 1 : 0, !q.has("static"));
</script>
</body>
</html>
