services:
  - type: web
    name: onboarding-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      # 회의 정리: false면 Slack으로 실제 전송한다 (SLACK_BOT_TOKEN·SLACK_CHANNEL_ID 필요). true면 내용만 보여 준다
      - key: ACTIONS_DRY_RUN
        value: "false"
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GCAL_CALENDAR_ID
        sync: false
      # 회의 정리 저장소: sheets면 Google Sheets에 저장해 재알림 배치(GitHub Actions)가 같은 시트를 읽는다.
      # 비우면 sqlite(컨테이너 안 파일, 재시작 때 지워짐). sheets는 GSHEETS_SPREADSHEET_ID·GOOGLE_SERVICE_ACCOUNT_JSON이 필요하다
      - key: STATE_BACKEND
        sync: false
      - key: GSHEETS_SPREADSHEET_ID
        sync: false
