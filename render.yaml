services:
  - type: web
    name: onboarding-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      # 회의록 기능: true면 Calendar·Slack으로 보내지 않고 내용만 보여 준다. 실제 전송은 아래 값을 모두 넣은 뒤 false로
      - key: ACTIONS_DRY_RUN
        value: "true"
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GCAL_CALENDAR_ID
        sync: false
